name: Playwright Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Choose environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - staging

jobs:
  test:
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment || 'dev' }}

    steps:
      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --------------------------------------------------
      # Install project dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------
      # Install Playwright browsers
      # Chromium + WebKit required for browser projects
      # --------------------------------------------------
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium webkit

      # --------------------------------------------------
      # Display versions for debugging
      # --------------------------------------------------
      - name: Display versions
        run: |
          node --version
          npm --version
          npx playwright --version
          npx allure --version

      # --------------------------------------------------
      # Run Playwright tests
      # --------------------------------------------------
      - name: Run Playwright Tests
        id: playwright-tests
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: npx playwright test

      # --------------------------------------------------
      # Generate Allure HTML report
      # Runs even if Playwright tests fail
      # --------------------------------------------------
      - name: Generate Allure Report
        if: always()
        run: |
          rm -rf allure-report
          npx allure generate --output allure-report allure-results

      # --------------------------------------------------
      # Upload Allure HTML report
      # --------------------------------------------------
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: warn

      # --------------------------------------------------
      # Upload raw Allure results
      # --------------------------------------------------
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn

      # --------------------------------------------------
      # Upload Playwright HTML report
      # --------------------------------------------------
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn

      # --------------------------------------------------
      # Upload test artifacts
      # Screenshots, videos and traces
      # --------------------------------------------------
      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
